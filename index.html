    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/Geist[wght].woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Source Serif 4";
        src: url("/fonts/SourceSerif4Variable-Italic.otf.woff2") format("woff2");
        font-display: optional;
        font-style: italic;
        font-weight: 200 900;
      }

      @font-face {
        font-family: "Source Serif 4 Fallback";
        src: local("Iowan Old Style"), local("Palatino Linotype"), local("URW Palladio L"), local("P052"), local("Georgia");
        size-adjust: 96%;
        ascent-override: 93%;
        descent-override: 26%;
        line-gap-override: 0%;
      }

      :root {
        --initial-page: oklch(0.96 0.012 60);
        --initial-surface: oklch(0.983 0.012 68);
        --initial-text: oklch(0.239 0.02 357);
        --initial-muted: oklch(0.504 0.024 7);
        --initial-border: oklch(0.886 0.026 52);
        --initial-accent: oklch(0.477 0.109 7);
        --initial-accent-hover: oklch(0.431 0.103 6);
        --initial-on-accent: oklch(0.983 0.012 68);
      }

      .dark {
        --initial-page: oklch(0.17 0.017 18);
        --initial-surface: oklch(0.205 0.018 18);
        --initial-text: oklch(0.94 0.014 62);
        --initial-muted: oklch(0.78 0.022 38);
        --initial-border: oklch(0.32 0.03 24);
        --initial-accent: oklch(0.61 0.095 18);
        --initial-accent-hover: oklch(0.67 0.09 20);
        --initial-on-accent: oklch(0.96 0.015 42);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--initial-page);
        color: var(--initial-text);
      }

      body {
        font-family: "Geist", Arial, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100dvh;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        var key = "parichay-theme-preference";
        var legacyKey = "ankahe-theme-preference";
        var preference = "system";

        try {
          var stored = window.localStorage.getItem(key);
          if (stored !== "light" && stored !== "dark" && stored !== "system") {
            stored = window.localStorage.getItem(legacyKey);
            if (stored === "light" || stored === "dark" || stored === "system") {
              window.localStorage.setItem(key, stored);
              window.localStorage.removeItem(legacyKey);
            }
          }
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (error) {
          preference = "system";
        }

        var resolved = preference;
        if (preference === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.themeResolved = resolved;
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Parichay",
        "alternateName": "Your story always ready",
        "url": "https://parichay-your-story.vercel.app/",
        "description": "A privacy-first web application for creating private personal manuals and sharing only the parts you choose.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  </body>
