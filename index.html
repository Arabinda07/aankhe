<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ankahe: Create private manuals for how you work, connect, and repair. A privacy-first, stateless tool for better collaboration and understanding." />
    <meta property="og:title" content="Ankahe | Be understood" />
    <meta property="og:description" content="Create private manuals for how you work, connect, and repair. No account, no database, just a link or export." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:alt" content="Ankahe private manual studio preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.svg" />
    <link rel="preload" href="/fonts/Geist[wght].woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SourceSerif4Variable-Roman.otf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SourceSerif4Variable-Italic.otf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var key = "ankahe-theme-preference";
        var preference = "system";

        try {
          var stored = window.localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (error) {
          preference = "system";
        }

        var resolved = preference;
        if (preference === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.themeResolved = resolved;
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ankahe",
        "description": "A privacy-first web application for creating personal and professional operating manuals.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <title>Ankahe | Be understood</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
